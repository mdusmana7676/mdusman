<!DOCTYPE html>
<html>
<head>
    <title>Online Book Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>Book Finder</h1>
        <p>Discover and explore books online</p>
    </header>

    <div class="search-box">
        <input type="text" id="bookName" placeholder="Enter book title or subject">
        <button id="searchBtn">Search Books</button>
    </div>

    <div id="message">Search for your favourite books.</div>

    <div id="bookList" class="book-list"></div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>

</body>
</html>
